name: Discover organization repositories

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    # GitHub cron uses UTC; odd UTC hours are even hours in Asia/Seoul.
    - cron: "0 1-23/2 * * *"

permissions:
  contents: write

concurrency:
  group: organization-repository-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/create-github-app-token@v3.2.0
        id: github-app-token
        with:
          client-id: ${{ vars.HUB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUB_GITHUB_APP_PRIVATE_KEY }}
          owner: side-projects-labs
          permission-metadata: read
          permission-contents: read
      - name: Create separate onboarding writer token
        if: vars.HUB_ONBOARDING_ENABLED == 'true'
        uses: actions/create-github-app-token@v3.2.0
        id: onboarding-app-token
        with:
          client-id: ${{ vars.HUB_ONBOARDING_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUB_ONBOARDING_APP_PRIVATE_KEY }}
          owner: side-projects-labs
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write
      - name: Report disabled repository onboarding
        if: vars.HUB_ONBOARDING_ENABLED != 'true'
        run: echo "Repository onboarding is disabled; configure the separate writer App to enable it."
      - name: Report disabled project API sync
        if: vars.HUB_PROJECT_SYNC_ENABLED != 'true'
        run: echo "Project API sync is disabled; configure the service client to enable it."
      - name: Read default-branch project information
        run: pnpm discover
        env:
          HUB_PROJECT_SYNC_ENABLED: ${{ vars.HUB_PROJECT_SYNC_ENABLED }}
          PORTFOLIO_API_URL: ${{ vars.PORTFOLIO_API_URL }}
          PORTFOLIO_SERVICE_CLIENT_ID: ${{ vars.PORTFOLIO_SERVICE_CLIENT_ID }}
          PORTFOLIO_SERVICE_CLIENT_SECRET: ${{ secrets.PORTFOLIO_SERVICE_CLIENT_SECRET }}
          HUB_ONBOARDING_ENABLED: ${{ vars.HUB_ONBOARDING_ENABLED }}
          HUB_ONBOARDING_TOKEN: ${{ steps.onboarding-app-token.outputs.token }}
          HUB_GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
          HUB_STATE_TOKEN: ${{ github.token }}
          HUB_STATE_REPOSITORY: ${{ github.repository }}
